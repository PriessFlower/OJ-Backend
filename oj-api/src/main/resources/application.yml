server:
  port: 8101
  servlet:
    context-path: /api
spring:
  # 默认dev环境
  profiles:
    active: dev
  # 支持swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sb-oj?useUnicode=true&characterEncoding=utf-8&useSSL=true
    username: root
    password: abc123456




# springdoc相关配置
springdoc:
  swagger-ui:
    # 自定义swagger前端请求路径，输入http：127.0.0.1:8080/swagger-ui.html会自动重定向到swagger页面
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs    # swagger后端请求地址
    enabled: true   # 是否开启文档功能
  packages-to-scan: com.zrx.controller
#  group-configs:
#    - group: 'com.zrx'
#      paths-to-match: '/**'
#      # 按包路径匹配:一般到启动类的包名
#      packages-to-scan: com.zrx

# knife4j相关配置 可以不用改
knife4j:
  enable: true    # 开启knife4j，无需添加@EnableKnife4j注解
  setting:
    language: zh_cn   # 中文
    swagger-model-name: 实体类   # 重命名SwaggerModel名称,默认
    # 为了添加 basePath
    enable-host: true
    enable-host-text: "localhost:8101/api"
  # 开启Swagger的Basic认证功能,默认是false
#  basic:
#    enable: true
#    # Basic认证用户名
#    username: zrx
#    # Basic认证密码
#    password: 123456
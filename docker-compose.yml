version: '3.8'
# 本地开发环境编排
services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: oj-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oj-system
      MYSQL_USER: oj-system
      MYSQL_PASSWORD: ZTzt5201314.
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - oj-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: oj-redis
    restart: always
    command: redis-server --requirepass ZTzt5201314. --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - oj-network

  # MinIO 对象存储
  minio:
    image: minio/minio:latest
    container_name: oj-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ZTzt5201314.
    ports:
      - "9000:9000"      # API 端口
      - "9001:9001"      # Console 端口
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - oj-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

networks:
  oj-network:
    driver: bridge

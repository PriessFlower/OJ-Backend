name: OJ-Backend CI/CD Pipeline

on:
  push:
    branches:
      - master  # 监听 master 分支的推送

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. 配置 Java & Maven 环境
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. 编译并打包多模块项目
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. 登录 Docker 镜像仓库
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. 构建并推送后端主程序的 Docker 镜像
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/oj-backend:latest

      # 6. SSH 登录服务器并执行自动化部署
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # 拉取最新镜像
            docker pull ${{ secrets.DOCKER_USERNAME }}/oj-backend:latest
            
            # 停止并删除正在运行的旧容器
            docker stop oj-backend-container 2>/dev/null || true
            docker rm oj-backend-container 2>/dev/null || true
            
            # 启动新容器（使用单行命令避免转义问题）
            docker run -d --network host -v /var/run/docker.sock:/var/run/docker.sock \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e REDIS_HOST=${{ secrets.REDIS_HOST }} \
              -e REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }} \
              -e MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }} \
              -e MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }} \
              -e MYSQL_URL=${{ secrets.MYSQL_URL }} \
              -e MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
              --name oj-backend-container \
              ${{ secrets.DOCKER_USERNAME }}/oj-backend:latest
name: OJ-Backend CI/CD Pipeline

on:
  push:
    branches:
      - master  # 监听 master 分支的推送

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. 配置 Java & Maven 环境
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. 编译并打包多模块项目
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. 登录 Docker 镜像仓库
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. 构建并推送后端主程序的 Docker 镜像
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/oj-backend:latest

      # 6. SSH 登录服务器并执行自动化部署
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: DOCKER_USERNAME,REDIS_HOST,REDIS_PASSWORD,MINIO_ENDPOINT,MINIO_SECRET_KEY,MYSQL_HOST,MYSQL_PORT,MYSQL_DATABASE,MYSQL_USERNAME,MYSQL_PASSWORD
          script: |
            # 拉取最新镜像
            docker pull $DOCKER_USERNAME/oj-backend:latest

            # 停止并删除正在运行的旧容器
            docker stop oj-backend-container 2>/dev/null || true
            docker rm oj-backend-container 2>/dev/null || true

            # 启动新容器
            docker run -d --network host \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /app/tmpCode:/app/tmpCode \
              -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e REDIS_HOST="$REDIS_HOST" \
              -e REDIS_PASSWORD="$REDIS_PASSWORD" \
              -e MINIO_ENDPOINT="$MINIO_ENDPOINT" \
              -e MINIO_SECRET_KEY="$MINIO_SECRET_KEY" \
              -e MYSQL_HOST="$MYSQL_HOST" \
              -e MYSQL_PORT="$MYSQL_PORT" \
              -e MYSQL_DATABASE="$MYSQL_DATABASE" \
              -e MYSQL_USERNAME="$MYSQL_USERNAME" \
              -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              --name oj-backend-container \
              $DOCKER_USERNAME/oj-backend:latest